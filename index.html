<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF EMOTE SENDER - VIP MAGICAL GENERATOR</title>
    <style>
        /* VIP Cyberpunk/Gaming Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #120224 0%, #030008 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(10, 3, 22, 0.9);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 30px #00ffcc, inset 0 0 20px rgba(0, 255, 204, 0.2);
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        /* VIP Top Border Glow Effect */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ff007c, #00ffcc, #ff007c);
            background-size: 200% auto;
            animation: barGlow 3s linear infinite;
        }

        @keyframes barGlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        h1 {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 15px #ff007c, 0 0 30px #ff007c;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .vip-badge {
            background: linear-gradient(45deg, #ffd700, #ffae00);
            color: #000;
            font-weight: bold;
            padding: 5px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            display: inline-block;
            margin-bottom: 30px;
            box-shadow: 0 0 15px #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .instruction {
            color: #b3b3b3;
            font-size: 1.1rem;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        /* Premium Emote Grid */
        .emote-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 480px) {
            .emote-grid {
                grid-template-columns: 1fr;
            }
        }

        .emote-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 124, 0.2);
            border-radius: 15px;
            padding: 20px 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .emote-card:hover {
            transform: translateY(-8px);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            background: rgba(255, 215, 0, 0.03);
        }

        .emote-card.selected {
            border-color: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            background: rgba(0, 255, 204, 0.08);
        }

        /* Emote Real Images Styling */
        .emote-img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.1));
            transition: 0.3s;
        }

        .emote-card:hover .emote-img {
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
            transform: scale(1.05);
        }

        .emote-card.selected .emote-img {
            filter: drop-shadow(0 0 18px rgba(0, 255, 204, 0.9));
        }

        .emote-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Form Inputs */
        .input-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        input[type="number"] {
            width: 100%;
            padding: 18px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff007c;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        input[type="number"]:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
        }

        /* VIP Injector Button */
        .btn-send {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #ff007c, #9900ff);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 0 6px 20px rgba(255, 0, 124, 0.4);
        }

        .btn-send:hover {
            background: linear-gradient(45deg, #9900ff, #ff007c);
            box-shadow: 0 0 30px #ff007c;
            transform: scale(1.02);
        }

        /* Magical Advanced Progress Section */
        .progress-container {
            display: none;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .progress-bar-bg {
            background: #222;
            width: 100%;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffcc, #ff007c);
            transition: width 0.1s linear;
            box-shadow: 0 0 10px #00ffcc;
        }

        .progress-text {
            font-size: 0.9rem;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Live Activity Footer Widget */
        .live-activity {
            margin-top: 35px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }
        .live-status {
            color: #00ffcc;
            animation: pulse 1s infinite;
        }

        /* Popup Notification Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 0, 8, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #0b0214;
            border: 3px solid #ffd700;
            box-shadow: 0 0 40px #ffd700;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            transform: scale(0.7);
            transition: 0.4s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .success-badge {
            font-size: 4.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        .modal-title {
            font-size: 2rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-text {
            font-size: 1.15rem;
            color: #f0f0f0;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .btn-close {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #000;
            padding: 12px 35px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .btn-close:hover {
            box-shadow: 0 0 25px #ffd700;
            transform: translateY(-2px);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FF EMOTE SENDER</h1>
        <div class="vip-badge">✨ MAGICAL VIP INJECTOR V4.2 ✨</div>
        <p class="instruction">Select your premium emote and input your Player UID below!</p>

        <!-- 5 VIP Emotes Grid with 100% Fixed Real Image URLs -->
        <div class="emote-grid">
            <!-- 1. LOL Emote -->
            <div class="emote-card" onclick="selectEmote(this, 'LOL Emote')">
                <img src="https://static.wikia.nocookie.net/garena-free-fire/images/e/e0/Lol_Emote.png" alt="LOL Emote" class="emote-img">
                <span class="emote-name">LOL Emote</span>
            </div>
            
            <!-- 2. Throne Emote -->
            <div class="emote-card" onclick="selectEmote(this, 'FFWC Throne Emote')">
                <img src="https://static.wikia.nocookie.net/garena-free-fire/images/0/07/FFWC_Throne_Emote.png" alt="Throne Emote" class="emote-img">
                <span class="emote-name">Throne Emote</span>
            </div>
            
            <!-- 3. Flower Emote -->
            <div class="emote-card" onclick="selectEmote(this, 'Flowers of Love')">
                <img src="https://static.wikia.nocookie.net/garena-free-fire/images/4/4c/Flowers_of_Love_Emote.png" alt="Flower Emote" class="emote-img">
                <span class="emote-name">Flower Emote</span>
            </div>
            
            <!-- 4. Push-Up Emote -->
            <div class="emote-card" onclick="selectEmote(this, 'Push-up Emote')">
                <img src="https://static.wikia.nocookie.net/garena-free-fire/images/a/a2/Push-up_Emote.png" alt="Push-Up Emote" class="emote-img">
                <span class="emote-name">Push-Up Emote</span>
            </div>
            
            <!-- 5. Booyah! Dance (Stretched beautifully at the bottom) -->
            <div class="emote-card" onclick="selectEmote(this, 'Booyah! Dance')" style="grid-column: span 2;">
                <img src="https://static.wikia.nocookie.net/garena-free-fire/images/e/ea/Booyah%21_Emote.png" alt="Booyah Dance" class="emote-img" style="width: 120px; height: 120px;">
                <span class="emote-name">Booyah! Dance</span>
            </div>
        </div>

        <!-- Inputs and Magical Processing Section -->
        <div class="input-group">
            <input type="number" id="playerUid" placeholder="ENTER PLAYER UID (e.g. 284719482)" required>
            <button class="btn-send" onclick="startInjection()">INJECT EMOTE TO ACCOUNT</button>
            
            <!-- Magical Progress Section -->
            <div class="progress-container" id="progressArea">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="barFill"></div>
                </div>
                <div class="progress-text" id="statusText">Connecting to Free Fire Server...</div>
            </div>
        </div>

        <!-- Fake Live Activity Widget -->
        <div class="live-activity">
            <span class="live-status">● Live:</span> User ID 583***91 successfully injected 'Throne Emote' 45s ago.
        </div>
    </div>

    <!-- VIP Success Popup Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-box">
            <div class="success-badge">👑</div>
            <div class="modal-title">INJECTION SUCCESSFUL</div>
            <div class="modal-text" id="successMessage">
                <!-- Data will inject here dynamically -->
            </div>
            <button class="btn-close" onclick="closeModal()">CONFIRM TRANSFER</button>
        </div>
    </div>

    <script>
        let selectedEmoteName = "";

        // Selection Script
        function selectEmote(element, emoteName) {
            const allCards = document.querySelectorAll('.emote-card');
            allCards.forEach(card => card.classList.remove('selected'));
            
            element.classList.add('selected');
            selectedEmoteName = emoteName;
        }

        // Magical Process Script
        function startInjection() {
            const uidInput = document.getElementById('playerUid').value.trim();
            const progressArea = document.getElementById('progressArea');
            const barFill = document.getElementById('barFill');
            const statusText = document.getElementById('statusText');

            if (!selectedEmoteName) {
                alert("ERROR: Please select a VIP Emote first!");
                return;
            }
            if (!uidInput || uidInput.length < 5) {
                alert("ERROR: Please enter a valid Free Fire Player UID!");
                return;
            }

            // Show Magic Progress Section
            progressArea.style.display = "block";
            barFill.style.width = "0%";
            
            let width = 0;
            const stages = [
                { limit: 20, text: "Bypassing Garena Anti-Cheat security..." },
                { limit: 50, text: "Locating player database stream..." },
                { limit: 80, text: "Injecting data packets into the server..." },
                { limit: 100, text: "Finalizing secure encryption code..." }
            ];

            let stageIndex = 0;
            
            // Magical Loading Interval
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    
                    // Delay for modal popup trigger
                    setTimeout(() => {
                        progressArea.style.display = "none";
                        
                        // Fake English Success Message Injection
                        const msgBox = document.getElementById('successMessage');
                        msgBox.innerHTML = `VIP Magical System has successfully transferred <strong>${selectedEmoteName}</strong> to Player UID: <strong>${uidInput}</strong>.<br><br><span style='color: #ffd700; font-weight: bold;'>Status: Processing In-Game Mail. Please check your account within 24 hours!</span>`;
                        
                        document.getElementById('successModal').classList.add('active');
                    }, 500);
                } else {
                    width++;
                    barFill.style.width = width + "%";
                    
                    if(stageIndex < stages.length && width >= stages[stageIndex].limit) {
                        statusText.innerText = stages[stageIndex].text;
                        stageIndex++;
                    }
                }
            }, 40); // Fast loading for excellent UX
        }

        // Close Action
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            document.getElementById('playerUid').value = "";
            const allCards = document.querySelectorAll('.emote-card');
            allCards.forEach(card => card.classList.remove('selected'));
            selectedEmoteName = "";
        }
    </script>
</body>
</html>
