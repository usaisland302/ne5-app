<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 NE5 MEGA ZONE - 1 Million Apps Engine</title>
    <style>
        /* --- PREMIUM DARK NEON THEME --- */
        :root {
            --bg-main: #07080d;
            --bg-card: #111420;
            --magic-green: #00ff87;
            --magic-blue: #00e1ff;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-white); 
            margin: 0; 
            padding: 0; 
            overflow-x: hidden;
        }

        /* --- NAV BAR --- */
        .top-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: rgba(17, 20, 32, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 255, 135, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            color: var(--magic-green);
            font-size: 26px;
            cursor: pointer;
            text-shadow: 0 0 10px var(--magic-green);
        }

        .magic-logo {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00ff87, #00e1ff, #ff007f, #00ff87);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: magicWave 4s linear infinite;
        }
        @keyframes magicWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- SIDEBAR MENU --- */
        .sidebar-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 150; display: none; opacity: 0; transition: opacity 0.3s ease;
        }
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: #0d101d; box-shadow: 5px 0 30px rgba(0, 255, 135, 0.15);
            z-index: 200; transition: left 0.3s ease; padding: 20px; box-sizing: border-box;
            border-right: 1px solid rgba(0, 255, 135, 0.2);
        }
        .sidebar.open { left: 0; }
        .sidebar-overlay.show { display: block; opacity: 1; }

        .sidebar-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .close-btn { background: none; border: none; color: #ff007f; font-size: 24px; cursor: pointer; }
        .menu-section-title { font-size: 12px; text-transform: uppercase; color: var(--magic-blue); letter-spacing: 1.5px; margin-top: 20px; margin-bottom: 10px; font-weight: bold; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; font-size: 14px; color: var(--text-white); text-decoration: none; }
        .menu-item:hover { background: rgba(0, 255, 135, 0.05); transform: translateX(5px); }

        /* --- SEARCH SECTION --- */
        .search-section { padding: 20px 15px; text-align: center; max-width: 500px; margin: 0 auto; }
        .search-box { 
            width: 100%; padding: 14px 22px; border-radius: 50px; 
            border: 2px solid #1c2333; background: #121824; color: white; 
            font-size: 16px; outline: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        .search-box:focus { border-color: var(--magic-blue); box-shadow: 0 0 15px rgba(0, 225, 255, 0.2); }
        .search-hint { font-size: 11px; color: var(--text-gray); margin-top: 8px; }

        /* --- 4-APPS-IN-A-LINE GRID --- */
        .app-grid { 
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px;
            padding: 0 10px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-card { 
            background: var(--bg-card); border-radius: 12px; padding: 10px; 
            border: 1px solid rgba(255,255,255,0.02); display: flex; flex-direction: column;
            align-items: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box; transition: all 0.2s; text-decoration: none; color: inherit;
        }
        .app-card:hover { transform: translateY(-3px); border-color: rgba(0, 255, 135, 0.2); }
        
        .icon-box {
            width: 55px; height: 55px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 16px; color: #000; background: linear-gradient(135deg, #00ff87, #00e1ff); 
            box-shadow: 0 3px 8px rgba(0, 255, 135, 0.2); text-transform: uppercase; margin-bottom: 8px;
        }
        
        .app-title { font-size: 11px; font-weight: 700; margin: 0 0 4px 0; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
        .app-meta { font-size: 9px; color: var(--text-gray); margin-bottom: 6px; }
        
        .download-btn { 
            background: linear-gradient(45deg, rgba(0, 255, 135, 0.15), rgba(0, 225, 255, 0.15));
            color: var(--magic-green); border: 1px solid rgba(0, 255, 135, 0.2);
            padding: 4px 0; border-radius: 6px; font-weight: 700; font-size: 10px; width: 100%; text-transform: uppercase;
        }
        .app-card:hover .download-btn { background: linear-gradient(45deg, #00ff87, #00e1ff); color: #000; border-color: transparent; }

        /* Mobile Optimization */
        @media (max-width: 480px) {
            .app-grid { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 5px; }
            .icon-box { width: 45px; height: 45px; font-size: 14px; }
            .app-title { font-size: 9px; height: 24px; }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <button class="menu-toggle-btn" onclick="toggleMenu()">☰</button>
        <div class="magic-logo">✨ NE5 APP ZONE ✨</div>
        <div style="width: 26px;"></div>
    </div>

    <div class="sidebar-overlay" id="menuOverlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="magicSidebar">
        <div class="sidebar-header">
            <span style="font-weight: 800; color: var(--magic-green); font-size: 16px;">🔮 MAGIC PANEL</span>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-section-title">⚙️ Settings</div>
        <div class="menu-item" onclick="alert('🎨 Switch Magic Neon Mode')">🎨 Switch Magic Neon Mode</div>
        <div class="menu-item" onclick="alert('Cache Cleared!')">🚀 Speed Boost</div>
        <div class="menu-section-title">📱 Channels</div>
        <a href="https://whatsapp.com/channel/0029VbDGuesHVvTaPjGUzn19" target="_blank" class="menu-item"><span style="color: #25d366;">💬</span> WhatsApp Channel</a>
    </div>

    <div class="search-section">
        <input type="text" id="searchBar" class="search-box" oninput="generateMillionApps()" placeholder="Search 1,000,000+ Apps...">
        <div class="search-hint">✨ Type any name (e.g., Free Fire, CapCut, TikTok, WhatsApp) to load 1 Million+ apps!</div>
    </div>

    <div class="app-grid" id="appGrid"></div>

    <script>
        // Default Trending List (Jab page load ho to shuru me yeh dikhe)
        const trendingApps = [
            "Free Fire", "CapCut", "Minecraft", "Subway Surfers", 
            "WhatsApp", "Instagram", "PUBG Mobile", "Ludo King", 
            "Spotify", "PicsArt", "TikTok", "Snapchat",
            "Candy Crush", "Clash of Clans", "Temple Run", "Hill Climb Racing"
        ];

        // 💥 CHALTI PHIRTI 1 MILLION APP ENGINE SCRIPT 💥
        function generateMillionApps() {
            const grid = document.getElementById('appGrid');
            const query = document.getElementById('searchBar').value.trim();
            grid.innerHTML = "";

            let appsList = [];

            if (query === "") {
                // Agar search khali hai to standard trending items load karo
                appsList = trendingApps;
            } else {
                // Agar user ne kuch type kiya, to usi naam ke 12 alag-alag VIP variations instantly generate karo
                appsList.push(query);
                appsList.push(query + " Mod Menu");
                appsList.push(query + " Premium");
                appsList.push(query + " Pro Unlocked");
                appsList.push(query + " Hack");
                appsList.push(query + " Lite");
                appsList.push(query + " Max");
                appsList.push(query + " Ultra");
                appsList.push(query + " Plus");
                appsList.push(query + " Beta");
                appsList.push("New " + query);
                appsList.push(query + " 2026");
            }

            appsList.forEach((appName) => {
                let shortName = appName.substring(0, 2);
                
                // Google Play Store Deep Link Setup
                let playStoreLink = `https://play.google.com/store/search?q=${encodeURIComponent(appName)}&c=apps`;
                
                let card = document.createElement('a');
                card.className = "app-card";
                card.href = playStoreLink;
                card.target = "_blank";
                
                // Random Size Generator for Realistic Look
                let randomSize = Math.floor(Math.random() * (180 - 20 + 1)) + 20;
                
                card.innerHTML = `
                    <div class="icon-box">${shortName}</div>
                    <div class="app-title">${appName}</div>
                    <div class="app-meta">⚡ ${randomSize}MB</div>
                    <div class="download-btn">GET</div>
                `;
                grid.appendChild(card);
            });
        }

        // Sidebar Control
        function toggleMenu() {
            document.getElementById('magicSidebar').classList.toggle('open');
            document.getElementById('menuOverlay').classList.toggle('show');
        }

        // Run Engine automatically on start
        window.onload = generateMillionApps;
    </script>
</body>
</html>
