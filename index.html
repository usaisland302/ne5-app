<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NEO-BLUE MOD MATRIX PRO | PRESTIGE EDITION</title>
    
    <!-- Ultra Modern Tech System Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ==========================================================================
           1. QUANTUM NEO-BLUE DESIGN SYSTEM (CORE TO THE ROOT VARIABLES)
           ========================================================================== */
        :root {
            --matrix-deep: #02040a;
            --cyber-dark: #050a17;
            --panel-bg: rgba(6, 15, 34, 0.85);
            --panel-border: rgba(0, 242, 254, 0.2);
            --electric-blue: #00f2fe;
            --void-glow: #4facfe;
            --acid-magenta: #ff2a6d;
            --matrix-green: #05f283;
            --text-high: #f0f6fc;
            --text-mid: #8b9bb4;
            --text-dark: #48546a;
            --font-tech: 'Rajdhani', sans-serif;
            --font-mono: 'Share Tech Mono', monospace;
            --font-logo: 'Orbitron', sans-serif;
            --glow-filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.6));
            --panel-shadow: 0 20px 45px rgba(0,0,0,0.85);
            --speed-fast: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --speed-normal: 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Core Resets & Hardware Accelerations */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        html, body {
            background-color: var(--matrix-deep);
            color: var(--text-high);
            font-family: var(--font-tech);
            min-height: 100vh;
            width: 100%;
            letter-spacing: 0.5px;
        }

        /* Futuristic Custom Scrollbar UI */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--matrix-deep);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 242, 254, 0.3);
            border-radius: 20px;
        }

        /* Background Dynamic Particles Overlay Effect (FIXED Z-INDEX) */
        .cyber-ambient-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Kept positive but behind content layers */
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            pointer-events: none;
        }

        .cyber-ambient-grid::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, transparent 10%, var(--matrix-deep) 80%);
        }

        /* Content Wrappers (FIXED Z-INDEX to stay above background) */
        .glass-mainframe-nav, .mainframe-hud-hero, .live-matrix-ticker, .mainframe-content-wrapper, .mainframe-form-section, footer {
            position: relative;
            z-index: 10;
        }

        /* ==========================================================================
           2. MODERN NAVIGATION PANEL DESIGN
           ========================================================================== */
        .glass-mainframe-nav {
            position: sticky; /* Changed to sticky for safe mobile rendering */
            top: 0;
            width: 100%;
            padding: 15px 4%;
            background: rgba(2, 4, 10, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .brand-node {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-terminal-icon {
            font-size: 22px;
            color: var(--electric-blue);
            filter: var(--glow-filter);
        }

        .brand-moniker {
            font-family: var(--font-logo);
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--text-high);
            text-transform: uppercase;
        }

        .brand-moniker span {
            color: var(--electric-blue);
        }

        .brand-moniker .version-badge {
            font-family: var(--font-mono);
            font-size: 10px;
            background: var(--acid-magenta);
            color: #fff;
            padding: 1px 5px;
            border-radius: 3px;
            vertical-align: super;
            margin-left: 5px;
        }

        .center-matrix-menu {
            display: flex;
            list-style: none;
            gap: 5px;
            background: rgba(255,255,255,0.02);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .center-matrix-menu li a {
            color: var(--text-mid);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 20px;
            transition: var(--speed-fast);
        }

        .center-matrix-menu li a.active-node {
            color: var(--matrix-deep);
            background: linear-gradient(90deg, var(--electric-blue), var(--void-glow));
            font-weight: 700;
        }

        .right-terminal-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .server-status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            background: rgba(5, 242, 131, 0.05);
            border: 1px solid rgba(5, 242, 131, 0.2);
            padding: 6px 14px;
            border-radius: 6px;
            color: var(--matrix-green);
        }

        .server-status-indicator span {
            width: 6px;
            height: 6px;
            background: var(--matrix-green);
            border-radius: 50%;
            display: inline-block;
        }

        /* ==========================================================================
           3. ADVANCED MATRIX DASHBOARD HERO HUD
           ========================================================================== */
        .mainframe-hud-hero {
            padding: 40px 4%;
            max-width: 1440px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.5fr 1.5fr;
            gap: 40px;
            align-items: center;
        }

        .hud-left-data-block h1 {
            font-family: var(--font-logo);
            font-weight: 900;
            font-size: 2.8rem;
            line-height: 1.2;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .hud-left-data-block h1 span {
            background: linear-gradient(90deg, var(--electric-blue), #ffffff, var(--void-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hud-left-data-block p {
            font-size: 16px;
            color: var(--text-mid);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Live Global Database Counter Blocks */
        .live-quantum-counters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .quantum-counter-card {
            background: rgba(6, 15, 34, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            border-left: 3px solid var(--electric-blue);
        }

        .q-number {
            font-family: var(--font-mono);
            font-size: 22px;
            font-weight: 700;
            color: var(--text-high);
        }

        .q-label {
            font-size: 11px;
            color: var(--text-dark);
            text-transform: uppercase;
            font-weight: 700;
        }

        /* Right Panel Logs Area */
        .hud-right-control-panel {
            background: rgba(4, 8, 20, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--panel-shadow);
        }

        .panel-header-spec {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .panel-heading-title {
            font-family: var(--font-logo);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-high);
        }

        .terminal-stream-logger {
            background: #02050c;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-mid);
            margin-bottom: 20px;
        }

        .log-entry-line {
            margin-bottom: 4px;
        }

        .log-timestamp { color: var(--text-dark); }
        .log-status-success { color: var(--matrix-green); }

        .hud-integrated-search-box {
            position: relative;
        }

        .hud-integrated-search-box input {
            width: 100%;
            background: #02050c;
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 10px;
            padding: 14px 20px;
            color: #fff;
            font-family: var(--font-tech);
            font-size: 15px;
        }

        /* ==========================================================================
           4. LIVE NETWORK TICKER BANNER
           ========================================================================== */
        .live-matrix-ticker {
            background: rgba(0, 242, 254, 0.03);
            padding: 12px 0;
            border-top: 1px solid rgba(0, 242, 254, 0.1);
            border-bottom: 1px solid rgba(0, 242, 254, 0.1);
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-scroller-node {
            display: inline-block;
            animation: scrollerEngine 25s linear infinite;
        }

        .ticker-data-segment {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-right: 50px;
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .ticker-data-segment span.highlight-green {
            color: var(--matrix-green);
        }

        @keyframes scrollerEngine {
            0% { transform: translate3d(0,0,0); }
            100% { transform: translate3d(-50%,0,0); }
        }

        /* ==========================================================================
           5. CONTENT LAYOUT BASE & CARDS GRID
           ========================================================================== */
        .mainframe-content-wrapper {
            max-width: 1440px;
            margin: 40px auto;
            padding: 0 4%;
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
        }

        .matrix-sidebar-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-section-block {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
        }

        .sidebar-title-label {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-dark);
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
            font-weight: 700;
        }

        .sidebar-action-menu-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-menu-btn {
            width: 100%;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-mid);
            padding: 10px 14px;
            border-radius: 8px;
            text-align: left;
            font-family: var(--font-tech);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu-btn.active-pill {
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--electric-blue);
        }

        .counter-pill-badge {
            font-family: var(--font-mono);
            font-size: 11px;
            background: #02050c;
            padding: 2px 6px;
            border-radius: 20px;
        }

        /* Content Deck Panels Grid */
        .dashboard-grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 12px 20px;
            border-radius: 12px;
        }

        .matrix-ultimate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .cyber-matrix-card {
            background: linear-gradient(135deg, rgba(6,15,34,0.9), rgba(3,7,18,0.95));
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card-floating-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-family: var(--font-mono);
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .card-floating-badge.status-vip { background: rgba(255, 179, 0, 0.1); border: 1px solid #ffb300; color: #ffb300;}
        .card-floating-badge.status-critical { background: rgba(255, 42, 109, 0.1); border: 1px solid var(--acid-magenta); color: var(--acid-magenta);}

        .card-upper-meta-cluster {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-avatar-container {
            width: 50px;
            height: 50px;
            background: #02050c;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 2px;
        }

        .card-avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            object-fit: cover;
        }

        .card-title-stack h3 {
            font-family: var(--font-logo);
            font-size: 14px;
            color: var(--text-high);
        }

        .card-category-tag {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-dark);
        }

        .card-spec-grid-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(20, 20, 20, 0.3);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .m-spec-title { font-size: 10px; color: var(--text-dark); }
        .m-spec-val { font-family: var(--font-mono); font-size: 12px; color: var(--electric-blue); }

        .card-features-injection-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .card-features-injection-list li i { color: var(--matrix-green); margin-right: 6px; }

        .card-action-terminal-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .card-primary-deploy-btn {
            flex-grow: 1;
            background: linear-gradient(90deg, var(--electric-blue), var(--void-glow));
            color: var(--matrix-deep);
            border: none;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            text-transform: uppercase;
        }

        /* Empty Screen Block View */
        .empty-mainframe-view {
            grid-column: 1 / -1;
            background: var(--panel-bg);
            border: 1px dashed var(--panel-border);
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        /* ==========================================================================
           6. INTERACTIVE REQUEST DATA FORM
           ========================================================================== */
        .mainframe-form-section {
            max-width: 1440px;
            margin: 40px auto;
            padding: 0 4%;
        }

        .mainframe-form-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
        }

        .form-left-context h2 { font-family: var(--font-logo); font-size: 22px; margin-bottom: 10px; }
        .form-left-context p { color: var(--text-mid); font-size: 14px; }

        .form-right-inputs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .form-input-field-node { display: flex; flex-direction: column; gap: 6px; }
        .form-input-field-node.span-full { grid-column: 1 / -1; }
        .form-input-field-node label { font-family: var(--font-mono); font-size: 11px; color: var(--text-mid); }
        
        .form-input-field-node input, .form-input-field-node select, .form-input-field-node textarea {
            background: #02050c;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 12px;
            color: #fff;
            font-family: var(--font-tech);
        }

        .submit-terminal-form-btn {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, var(--electric-blue), var(--void-glow));
            border: none;
            color: var(--matrix-deep);
            padding: 14px;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-weight: 900;
            cursor: pointer;
        }

        footer {
            background: #010206;
            border-top: 1px solid var(--panel-border);
